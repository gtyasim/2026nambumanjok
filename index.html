<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 2학기 초등 돌봄교육 만족도 조사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        .scale-radio:checked + label {
            background-color: #22c55e;
            color: white;
            border-color: #22c55e;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <header class="bg-green-600 text-white shadow-md p-4 flex justify-between items-center z-10 sticky top-0">
        <h1 class="text-lg md:text-xl font-bold cursor-pointer" onclick="navigate('home')">
            <i class="fa-solid fa-seedling mr-2"></i>초등 돌봄교육 만족도 조사
        </h1>
        <button onclick="navigate('admin_login')" class="text-sm bg-green-700 hover:bg-green-800 px-3 py-1 rounded shadow transition">
            관리자 <i class="fa-solid fa-lock ml-1"></i>
        </button>
    </header>

    <main id="app-container" class="flex-grow p-4 overflow-y-auto w-full max-w-4xl mx-auto flex flex-col items-center">
        <!-- Content gets injected here by JS -->
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 fade-in">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
            <h3 id="modal-title" class="text-lg font-bold mb-2 text-gray-900">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-medium transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Setup ---
        // AI 테스트 환경과 실제 배포 환경을 호환되도록 설정합니다.
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'uiseong-nambu-survey';
        
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        // ★ 중요: 실제 링크로 다른 사람에게 배포하실 때는 구글 파이어베이스(Firebase)에서 발급받은 정보로 아래를 채워주셔야 합니다!
        if (!firebaseConfig) {
            firebaseConfig = {
                apiKey: "여기에_API_KEY_입력",
                authDomain: "여기에_AUTH_DOMAIN_입력",
                projectId: "여기에_PROJECT_ID_입력",
                storageBucket: "여기에_STORAGE_BUCKET_입력",
                messagingSenderId: "여기에_MESSAGING_SENDER_ID_입력",
                appId: "여기에_APP_ID_입력"
            };
        }
        
        let app, db, auth;
        // Firebase 설정이 제대로 입력되었을 때만 클라우드 DB 연결을 시도합니다.
        if (firebaseConfig && firebaseConfig.apiKey !== "여기에_API_KEY_입력") {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            initAuth();
        } else {
            console.warn("⚠️ 클라우드 데이터베이스가 연결되지 않아 접속자의 임시 메모리에만 저장됩니다.");
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                setupRealtimeListeners();
            } catch (e) {
                console.error("Auth error:", e);
            }
        }

        function setupRealtimeListeners() {
            if (!db || !auth.currentUser) return;
            const collections = ['parentGeneral', 'studentGeneral', 'programSpecific'];
            collections.forEach(type => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', type);
                onSnapshot(colRef, (snapshot) => {
                    window.surveys[type] = snapshot.docs.map(doc => doc.data());
                    // Refresh dashboard if it's currently open
                    const container = document.getElementById('app-container');
                    if (container && container.innerHTML.includes('설문조사 통계 대시보드')) {
                        window.renderAdminDashboard(container);
                    }
                }, (error) => console.error("Firebase listen error:", error));
            });
        }

        // --- In-Memory State (fallback & local cache) ---
        window.surveys = {
            parentGeneral: [],
            studentGeneral: [],
            programSpecific: []
        };

        const labelsType1 = ["매우 그렇다", "그렇다", "보통이다", "그렇지 않다", "매우 그렇지 않다"];
        const labelsType2 = ["매우 충분하다", "충분하다", "보통이다", "부족하다", "매우 부족하다"];

        window.currentRole = null;
        window.completedPrograms = [];

        // --- Utility Functions ---
        window.showModal = function(title, message, onClose = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').onCloseCallback = onClose || null;
        };

        window.closeModal = function() {
            document.getElementById('modal').classList.add('hidden');
            if (document.getElementById('modal').onCloseCallback) {
                document.getElementById('modal').onCloseCallback();
            }
        };

        // --- Navigation Logic ---
        window.navigate = function(view, params = null) {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            
            if (view === 'home') {
                window.currentRole = null;
                window.completedPrograms = [];
                window.renderHome(container);
            } else if (view === 'grade_menu') {
                window.renderGradeMenu(container);
            } else if (view === 'role_menu') {
                window.currentRole = params.role;
                window.renderRoleMenu(container);
            } else if (view === 'survey_form') {
                window.renderSurveyForm(container, params.type);
            } else if (view === 'admin_login') {
                window.renderAdminLogin(container);
            } else if (view === 'admin_dashboard') {
                window.renderAdminDashboard(container);
            } else if (view === 'survey_complete') {
                window.renderSurveyComplete(container, params.type);
            }
        };

        window.renderHome = function(container) {
            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-md w-full border-t-4 border-green-500">
                        <div class="flex items-center justify-center gap-3 mb-4">
                            <i class="fa-solid fa-school text-4xl text-green-500"></i>
                            <h2 class="text-2xl font-bold text-gray-700">의성남부초등학교</h2>
                        </div>
                        <h3 class="text-xl font-bold mb-2">초등 돌봄교육 만족도 조사</h3>
                        <p class="text-gray-500 mb-8 text-sm">참여하시는 분의 구분을 선택해주세요.<br>본 조사는 무기명으로 진행됩니다.</p>
                        
                        <div class="flex flex-col gap-4 w-full">
                            <button onclick="navigate('role_menu', {role: 'parent'})" class="flex items-center justify-center p-4 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl border border-blue-200 transition font-bold text-lg">
                                <i class="fa-solid fa-user-group mr-3 text-xl"></i> 학부모님
                            </button>
                            <button onclick="navigate('grade_menu')" class="flex items-center justify-center p-4 bg-yellow-50 hover:bg-yellow-100 text-yellow-700 rounded-xl border border-yellow-200 transition font-bold text-lg">
                                <i class="fa-solid fa-child-reaching mr-3 text-xl"></i> 학생
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.renderGradeMenu = function(container) {
            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <button onclick="navigate('home')" class="self-start mb-4 text-gray-500 hover:text-gray-800 transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 처음으로
                    </button>
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-md w-full border-t-4 border-yellow-500">
                        <h3 class="text-xl font-bold mb-6 text-gray-800">학년군을 선택해주세요</h3>
                        
                        <div class="flex flex-col gap-4 w-full">
                            <button onclick="navigate('role_menu', {role: 'student_low'})" class="flex items-center justify-center p-4 bg-yellow-50 hover:bg-yellow-100 text-yellow-700 rounded-xl border border-yellow-200 transition font-bold text-lg">
                                1~2학년
                            </button>
                            <button onclick="navigate('role_menu', {role: 'student_high'})" class="flex items-center justify-center p-4 bg-yellow-50 hover:bg-yellow-100 text-yellow-700 rounded-xl border border-yellow-200 transition font-bold text-lg">
                                3~6학년
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.renderRoleMenu = function(container) {
            let roleName = '학부모';
            if (window.currentRole === 'student_low') roleName = '학생 (1~2학년)';
            if (window.currentRole === 'student_high') roleName = '학생 (3~6학년)';
            
            const icon = window.currentRole === 'parent' ? '<i class="fa-solid fa-user-group text-blue-500"></i>' : '<i class="fa-solid fa-child-reaching text-yellow-500"></i>';
            
            // 학부모인 경우 프로그램별 만족도 조사를 숨기기 위한 처리
            let programSpecificHtml = '';
            if (window.currentRole && window.currentRole.startsWith('student')) {
                programSpecificHtml = `
                    <div onclick="navigate('survey_form', {type: 'programSpecific'})" class="bg-white p-6 rounded-xl shadow hover:shadow-md cursor-pointer transition border border-gray-100 group">
                        <div class="bg-purple-100 w-12 h-12 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-shapes text-purple-600 text-xl"></i>
                        </div>
                        <h3 class="font-bold text-lg mb-2">프로그램별 만족도 조사</h3>
                        <p class="text-gray-500 text-sm">참여중인 개별 프로그램에 대한 만족도를 조사합니다.</p>
                    </div>
                `;
            }

            const backTarget = (window.currentRole && window.currentRole.startsWith('student')) ? 'grade_menu' : 'home';

            container.innerHTML = `
                <div class="w-full flex flex-col flex-grow fade-in max-w-2xl mt-8">
                    <button onclick="navigate('${backTarget}')" class="self-start mb-4 text-gray-500 hover:text-gray-800 transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 뒤로가기
                    </button>
                    
                    <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-green-500 mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2">
                            ${icon} ${roleName} 만족도 조사 메뉴
                        </h2>
                        <p class="text-gray-600 mt-2 text-sm">참여하실 설문조사를 선택해주세요.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div onclick="navigate('survey_form', {type: window.currentRole === 'parent' ? 'parentGeneral' : 'studentGeneral'})" class="bg-white p-6 rounded-xl shadow hover:shadow-md cursor-pointer transition border border-gray-100 group">
                            <div class="bg-green-100 w-12 h-12 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                <i class="fa-regular fa-clipboard text-green-600 text-xl"></i>
                            </div>
                            <h3 class="font-bold text-lg mb-2">운영 전반 만족도 조사</h3>
                            <p class="text-gray-500 text-sm">초등 돌봄교육 운영 전반에 대한 만족도를 조사합니다.</p>
                        </div>
                        ${programSpecificHtml}
                    </div>
                </div>
            `;
        };

        window.questionBanks = {
            parentGeneral: {
                title: "2026학년도 2학기 초등 돌봄교육 운영전반 만족도 조사 (학부모용)",
                questions: [
                    { id: "q1", text: "1. 초등 돌봄교육 운영 전반에 대해 만족한다.", type: "scale", labels: labelsType1 },
                    { id: "q2", text: "2. 현재 참여하고 있는 초등 돌봄교육 프로그램이 자녀의 특기·적성 계발 또는 학업 실력 향상에 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q3", text: "3. 초등 돌봄교육 프로그램이 사교육비를 줄이는 데 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q4", text: "4. 앞으로 초등 돌봄교육 프로그램에 자녀를 계속 참여시킬 의사가 있다.", type: "scale", labels: labelsType1 },
                    { id: "q5", text: "5. 기타 (개선 사항 및 추가 개설 희망 프로그램 등)", type: "text" }
                ]
            },
            studentGeneral: {
                title: "2026학년도 2학기 초등 돌봄교육 운영전반 만족도 조사 (학생용)",
                questions: [
                    { id: "q1", text: "1. 현재 참여하고 있는 초등 돌봄교육 프로그램에 대해 만족한다.", type: "scale", labels: labelsType1 },
                    { id: "q2", text: "2. 초등 돌봄교육 프로그램을 선택할 때, 프로그램에 대한 정보 제공(안내)은 충분했다.", type: "scale", labels: labelsType2 },
                    { id: "q3", text: "3. 현재 참여하고 있는 초등 돌봄교육 프로그램이 특기·적성 계발 또는 학업 실력 향상에 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q4", text: "4. 앞으로 초등 돌봄교육 프로그램에 계속 참여하고 싶다.", type: "scale", labels: labelsType1 },
                    { id: "q5", text: "5. 기타 (개선 사항 및 추가 개설 희망 프로그램 등)", type: "text" }
                ]
            },
            programSpecific: {
                title: "프로그램별 만족도 조사",
                requiresProgramName: true,
                questions: [
                    { id: "q1", text: "1. 강사가 프로그램 운영 시간을 잘 지켰다.", type: "scale", labels: labelsType1 },
                    { id: "q2", text: "2. 사용된 교재 및 교구는 프로그램 활동에 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q3", text: "3. 학생이 프로그램에 적극 참여할 수 있도록 관심을 가지고 지도했다.", type: "scale", labels: labelsType2 },
                    { id: "q4", text: "4. 이 프로그램이 특기·적성 계발 또는 학업 실력 향상에 도움이 되었다.", type: "scale", labels: labelsType1 }
                ]
            }
        };

        window.renderSurveyForm = function(container, type) {
            const surveyData = window.questionBanks[type];
            let formHTML = `
                <div class="w-full fade-in max-w-3xl mt-4 mb-10">
                    <button onclick="navigate('role_menu', {role: window.currentRole})" class="mb-4 text-gray-500 hover:text-gray-800 transition block">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 뒤로가기
                    </button>
                    
                    <div class="bg-white rounded-xl shadow-md overflow-hidden">
                        <div class="bg-green-600 text-white p-6">
                            <h2 class="text-xl md:text-2xl font-bold">${surveyData.title}</h2>
                            <p class="mt-2 text-green-100 text-sm">본 설문은 무기명으로 진행되며, 응답하신 내용은 통계 및 개선 목적으로만 활용됩니다.</p>
                        </div>
                        
                        <form id="survey-form" class="p-6 md:p-8" onsubmit="submitSurvey(event, '${type}')">
            `;

            if (surveyData.requiresProgramName) {
                let inputOptions = '';
                if (window.currentRole === 'student_low') {
                    const programs = ["감성음악(1~2학년)", "스토리텔링영어(1~2학년)", "놀이체육", "창의과학", "창의컴퓨터"];
                    let optionsHtml = '<option value="" disabled selected>참여 중인 프로그램을 선택하세요</option>';
                    programs.forEach(p => {
                        const isDone = window.completedPrograms.includes(p);
                        optionsHtml += `<option value="${p}" ${isDone ? 'disabled' : ''}>${p}${isDone ? ' (설문 완료)' : ''}</option>`;
                    });
                    inputOptions = `
                        <select id="programName" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white text-gray-800">
                            ${optionsHtml}
                        </select>
                    `;
                } else if (window.currentRole === 'student_high') {
                    const programs = ["창작심리미술", "스토리텔링영어(3~6학년)", "국악", "감성음악(3~6학년)", "생활체육", "드론스포츠", "놀이체육(3~6학년)"];
                    let optionsHtml = '<option value="" disabled selected>참여 중인 프로그램을 선택하세요</option>';
                    programs.forEach(p => {
                        const isDone = window.completedPrograms.includes(p);
                        optionsHtml += `<option value="${p}" ${isDone ? 'disabled' : ''}>${p}${isDone ? ' (설문 완료)' : ''}</option>`;
                    });
                    inputOptions = `
                        <select id="programName" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white text-gray-800">
                            ${optionsHtml}
                        </select>
                    `;
                } else {
                    inputOptions = `<input type="text" id="programName" required placeholder="예: 창의미술, AI코딩" class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">`;
                }

                formHTML += `
                            <div class="mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                                <label for="programName" class="block font-bold mb-2 text-gray-800">
                                    <span class="text-red-500 mr-1">*</span>참여 프로그램명
                                </label>
                                ${inputOptions}
                            </div>
                `;
            }

            surveyData.questions.forEach((q, idx) => {
                formHTML += `
                    <div class="mb-8 pb-8 ${idx !== surveyData.questions.length - 1 ? 'border-b border-gray-100' : ''}">
                        <h4 class="font-bold text-gray-800 mb-4 whitespace-pre-wrap leading-relaxed">${q.text}</h4>
                `;

                if (q.type === 'scale') {
                    formHTML += `<div class="grid grid-cols-1 sm:grid-cols-5 gap-2">`;
                    q.labels.forEach((label, i) => {
                        const valNumber = i + 1;
                        const uniqueId = `${q.id}_${valNumber}`;
                        formHTML += `
                            <div class="relative">
                                <input type="radio" name="${q.id}" id="${uniqueId}" value="${label}" required class="peer sr-only scale-radio">
                                <label for="${uniqueId}" class="flex flex-col items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm text-center h-full">
                                    <span class='inline-block w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs mb-1'>${valNumber}</span>
                                    <span class="font-medium text-gray-700">${label}</span>
                                </label>
                            </div>
                        `;
                    });
                    formHTML += `</div>`;
                } else if (q.type === 'text') {
                    formHTML += `
                        <textarea name="${q.id}" rows="3" placeholder="자유롭게 의견을 적어주세요." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition resize-none"></textarea>
                    `;
                }
                formHTML += `</div>`;
            });

            formHTML += `
                            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg shadow-lg transition text-lg mt-4">
                                설문 제출하기
                            </button>
                        </form>
                    </div>
                </div>
            `;
            container.innerHTML = formHTML;
        };

        window.submitSurvey = async function(event, type) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            let response = {
                timestamp: new Date().toISOString(),
                role: window.currentRole
            };

            const surveyData = window.questionBanks[type];
            
            if (surveyData.requiresProgramName) {
                response.programName = document.getElementById('programName').value.trim();
                window.completedPrograms.push(response.programName);
            }

            surveyData.questions.forEach(q => {
                response[q.id] = formData.get(q.id) || "";
            });

            // Save to Firebase if available, else local
            if (db && auth.currentUser) {
                try {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', type);
                    await addDoc(colRef, response);
                } catch (e) {
                    console.error("Save failed:", e);
                }
            } else {
                window.surveys[type].push(response);
            }

            // ★ 구글 시트로 데이터 전송 추가
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZ64rEzGVoc1iVFplJBVJ0Zbkz5yPfrICVraWry-yvIg-xUhzdZKJpl3ajBvuhWOOg/exec"; 
            if (GOOGLE_SCRIPT_URL !== "https://script.google.com/macros/s/AKfycbxZ64rEzGVoc1iVFplJBVJ0Zbkz5yPfrICVraWry-yvIg-xUhzdZKJpl3ajBvuhWOOg/exec") {
                const sheetData = { ...response, type: type };
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    // CORS 에러 방지를 위해 text/plain 사용
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(sheetData)
                }).catch(e => console.error("구글 시트 전송 실패:", e));
            }

            // 기존 알림창 대신 새로운 완료 화면으로 이동
            window.navigate('survey_complete', { type: type });
        };

        // --- 새로운 설문 제출 완료 화면 렌더링 함수 ---
        window.renderSurveyComplete = function(container, type) {
            let actionButtons = '';
            
            // 프로그램별 설문조사를 방금 마친 경우에만 '추가 설문' 버튼 표시
            if (type === 'programSpecific') {
                actionButtons = `
                    <button onclick="navigate('survey_form', {type: 'programSpecific'})" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition shadow-md mb-3">
                        <i class="fa-solid fa-rotate-right mr-2"></i>다른 강좌 추가 설문하기
                    </button>
                    <button onclick="navigate('home')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-lg transition">
                        <i class="fa-solid fa-house mr-2"></i>처음으로 돌아가기
                    </button>
                `;
            } else {
                // 운영 전반 만족도를 마친 경우는 바로 처음으로 돌아가기
                actionButtons = `
                    <button onclick="navigate('home')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition shadow-md">
                        <i class="fa-solid fa-check mr-2"></i>확인 (처음으로)
                    </button>
                `;
            }

            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-sm w-full border-t-4 border-green-500">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-check text-3xl text-green-500"></i>
                        </div>
                        <h2 class="text-2xl font-bold mb-2 text-gray-800">제출 완료</h2>
                        <p class="text-gray-600 mb-8">설문이 성공적으로 제출되었습니다.<br>참여해 주셔서 감사합니다!</p>
                        <div class="flex flex-col gap-2">
                            ${actionButtons}
                        </div>
                    </div>
                </div>
            `;
        };

        window.renderAdminLogin = function(container) {
            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-sm w-full">
                        <i class="fa-solid fa-lock text-4xl text-gray-700 mb-4"></i>
                        <h2 class="text-2xl font-bold mb-6 text-gray-800">관리자 모드</h2>
                        
                        <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                            <div class="mb-6 text-left">
                                <label class="block text-sm font-bold text-gray-700 mb-2">비밀번호</label>
                                <input type="password" id="admin-pw" class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 outline-none" required placeholder="비밀번호 입력">
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onclick="navigate('home')" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded transition">
                                    취소
                                </button>
                                <button type="submit" class="w-2/3 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded transition">
                                    접속
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        };

        window.handleAdminLogin = function(event) {
            event.preventDefault();
            const pw = document.getElementById('admin-pw').value;
            if (pw === '1208') {
                window.navigate('admin_dashboard');
            } else {
                window.showModal("로그인 실패", "비밀번호가 올바르지 않습니다.");
            }
        };

        window.confirmReset = function() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-md w-full border-t-4 border-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4"></i>
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">모든 데이터 초기화</h2>
                        <p class="text-gray-600 mb-8">정말로 모든 설문조사 결과를 삭제하시겠습니까?<br>이 작업은 되돌릴 수 없으며, 모든 통계가 0으로 초기화됩니다.</p>
                        <div class="flex gap-4">
                            <button onclick="navigate('admin_dashboard')" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded transition">
                                취소
                            </button>
                            <button onclick="executeReset()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded transition shadow">
                                삭제하기
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.executeReset = async function() {
            if (db && auth.currentUser) {
                const collections = ['parentGeneral', 'studentGeneral', 'programSpecific'];
                try {
                    // 모든 컬렉션을 순회하며 문서 삭제
                    for (const type of collections) {
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', type);
                        const snapshot = await getDocs(colRef);
                        const deletePromises = snapshot.docs.map(document => deleteDoc(document.ref));
                        await Promise.all(deletePromises);
                    }
                    
                    // 메모리상 데이터 초기화
                    window.surveys = { parentGeneral: [], studentGeneral: [], programSpecific: [] };
                    
                    window.showModal("초기화 완료", "모든 설문 데이터가 성공적으로 삭제되었습니다.", () => {
                        window.navigate('admin_dashboard');
                    });
                } catch (e) {
                    console.error("Delete failed:", e);
                    window.showModal("오류", "데이터 삭제 중 오류가 발생했습니다.");
                }
            } else {
                // 클라우드가 연결 안 된 로컬 상태일 때의 처리
                window.surveys = { parentGeneral: [], studentGeneral: [], programSpecific: [] };
                window.showModal("초기화 완료", "모든 설문 데이터가 삭제되었습니다.", () => {
                    window.navigate('admin_dashboard');
                });
            }
        };

        window.renderAdminDashboard = function(container) {
            const dataParent = window.surveys.parentGeneral || [];
            const dataStudent = window.surveys.studentGeneral || [];
            const dataProgram = window.surveys.programSpecific || [];
            
            const totalParent = dataParent.length;
            const totalStudent = dataStudent.length;
            const totalProgram = dataProgram.length;

            let html = `
                <div class="w-full fade-in max-w-5xl mt-4 mb-10">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-chart-pie mr-2 text-green-600"></i>설문조사 통계 대시보드</h2>
                        <div class="flex gap-2">
                            <button onclick="confirmReset()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded font-medium transition shadow">
                                <i class="fa-solid fa-trash-can mr-1"></i> 데이터 초기화
                            </button>
                            <button onclick="navigate('home')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-medium transition">
                                나가기
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                            <p class="text-gray-500 text-sm font-bold">학부모 운영전반 만족도</p>
                            <h3 class="text-3xl font-bold mt-2">${totalParent}<span class="text-lg text-gray-400 font-normal ml-1">명 참여</span></h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-yellow-500">
                            <p class="text-gray-500 text-sm font-bold">학생 운영전반 만족도</p>
                            <h3 class="text-3xl font-bold mt-2">${totalStudent}<span class="text-lg text-gray-400 font-normal ml-1">명 참여</span></h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-purple-500">
                            <p class="text-gray-500 text-sm font-bold">프로그램별 만족도</p>
                            <h3 class="text-3xl font-bold mt-2">${totalProgram}<span class="text-lg text-gray-400 font-normal ml-1">건 참여</span></h3>
                        </div>
                    </div>
            `;

            const generateStatHtml = (bank, dataSet, showPieChart = false) => {
                if (dataSet.length === 0) return `<p class="text-gray-500 text-center py-4">아직 수집된 응답이 없습니다.</p>`;
                
                let res = '';
                bank.questions.forEach(q => {
                    res += `<div class="mb-6 pb-6 border-b border-gray-100 last:border-0 last:pb-0"><h4 class="font-bold text-gray-700 text-sm mb-4">${q.text}</h4>`;
                    if (q.type === 'scale') {
                        let counts = {};
                        q.labels.forEach(l => counts[l] = 0);
                        dataSet.forEach(response => {
                            const val = response[q.id];
                            if (counts[val] !== undefined) counts[val]++;
                        });

                        const hexColors = ['#22c55e', '#3b82f6', '#eab308', '#f97316', '#ef4444'];
                        const tailwindColors = ['bg-green-500', 'bg-blue-500', 'bg-yellow-500', 'bg-orange-500', 'bg-red-500'];
                        
                        let gradientSegments = [];
                        let currentAccum = 0;

                        res += `<div class="flex flex-col md:flex-row gap-6 items-center">`;
                        res += `<div class="flex-grow w-full space-y-2">`;
                        
                        q.labels.forEach((label, i) => {
                            const count = counts[label];
                            const percentage = Math.round((count / dataSet.length) * 100) || 0;
                            
                            // 원그래프 조각 계산
                            if (percentage > 0) {
                                gradientSegments.push(`${hexColors[i]} ${currentAccum}% ${currentAccum + percentage}%`);
                                currentAccum += percentage;
                            }

                            res += `
                                <div class="flex items-center text-sm">
                                    <div class="w-32 truncate mr-2 flex items-center gap-2" title="${label}">
                                        ${showPieChart ? `<span class="w-3 h-3 rounded-full inline-block ${tailwindColors[i]}"></span>` : ''}
                                        <span>${i+1}. ${label.substring(0,6)}${label.length>6?'..':''}</span>
                                    </div>
                                    <div class="flex-grow bg-gray-100 rounded-full h-4 mr-4 overflow-hidden relative">
                                        <div class="${tailwindColors[i]} h-4 rounded-full" style="width: ${percentage}%"></div>
                                    </div>
                                    <div class="w-16 text-right font-medium text-gray-600">${count}명 <span class="text-xs text-gray-400">(${percentage}%)</span></div>
                                </div>
                            `;
                        });
                        res += `</div>`;

                        // 원그래프 출력 부분 (showPieChart가 true일 때만)
                        if (showPieChart && gradientSegments.length > 0) {
                            const conicGradient = gradientSegments.join(', ');
                            res += `
                                <div class="flex-shrink-0 flex flex-col items-center justify-center p-2">
                                    <div class="w-32 h-32 rounded-full shadow-inner" style="background: conic-gradient(${conicGradient});"></div>
                                    <span class="text-xs text-gray-400 mt-2 font-medium">응답 비율</span>
                                </div>
                            `;
                        }

                        res += `</div>`;
                    } else if (q.type === 'text') {
                        res += `<div class="bg-gray-50 p-4 rounded text-sm max-h-40 overflow-y-auto space-y-2">`;
                        const textResponses = dataSet.map(r => r[q.id]).filter(t => t && t.trim() !== '');
                        if (textResponses.length === 0) {
                            res += `<p class="text-gray-400 italic">의견이 없습니다.</p>`;
                        } else {
                            textResponses.forEach(t => {
                                res += `<div class="bg-white p-2 border border-gray-200 rounded text-gray-700 shadow-sm">- ${t}</div>`;
                            });
                        }
                        res += `</div>`;
                    }
                    res += `</div>`;
                });
                return res;
            };

            const wrapSection = (title, innerHtml) => `
                <div class="bg-white rounded-xl shadow mb-8 overflow-hidden">
                    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-bold text-gray-800">${title} 상세 통계</h3>
                    </div>
                    <div class="p-6">${innerHtml}</div>
                </div>
            `;

            html += wrapSection('학부모 운영전반 만족도', generateStatHtml(window.questionBanks.parentGeneral, dataParent, true));
            html += wrapSection('학생 운영전반 만족도', generateStatHtml(window.questionBanks.studentGeneral, dataStudent, true));
            
            // Program specific grouped
            if (totalProgram > 0) {
                const grouped = {};
                dataProgram.forEach(s => {
                    const pName = s.programName || '미지정';
                    if (!grouped[pName]) grouped[pName] = [];
                    grouped[pName].push(s);
                });

                let groupedHtml = '';
                for (const [pName, pData] of Object.entries(grouped)) {
                    groupedHtml += `
                        <div class="mb-8 border border-gray-200 rounded-lg p-4 bg-gray-50">
                            <h4 class="text-xl font-bold text-purple-700 mb-4 pb-2 border-b border-purple-200">
                                <i class="fa-solid fa-shapes mr-2"></i>[${pName}] 강좌 통계 <span class="text-sm font-normal text-gray-500">(${pData.length}명 참여)</span>
                            </h4>
                            <div class="bg-white p-4 rounded border border-gray-100">
                                ${generateStatHtml(window.questionBanks.programSpecific, pData, true)}
                            </div>
                        </div>
                    `;
                }
                html += wrapSection('프로그램별 만족도 (강좌별 상세)', groupedHtml);
            } else {
                html += wrapSection('프로그램별 만족도', `<p class="text-gray-500 text-center py-4">아직 수집된 응답이 없습니다.</p>`);
            }

            html += `</div>`;
            container.innerHTML = html;
        };

        window.onload = () => {
            window.navigate('home');
        };
    </script>
</body>
</html>
